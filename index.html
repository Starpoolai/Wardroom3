<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>ORBITAL COMMAND v5</title>
<style>
:root{--bg:#05070f;--panel:rgba(11,17,32,.85);--panel2:rgba(14,22,40,.95);--line:#1b2a4a;--cyan:#00e5ff;--violet:#b44fff;--green:#22e58c;--amber:#ffb020;--red:#ff5566;--text:#cfe3ff;--dim:#6b84b0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 700px at 50% -10%,#0c1a3a 0%,var(--bg) 70%);color:var(--text);font-family:system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:2px;color:var(--cyan);font-size:13px;white-space:nowrap}.logo span{color:var(--violet)}
#kpis{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}#kpis::-webkit-scrollbar{display:none}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;white-space:nowrap}
.kpi b{font-size:12px;color:#fff;font-variant-numeric:tabular-nums}
.kpi small{font-size:8px;letter-spacing:1px;color:var(--dim);display:block;text-transform:uppercase}
.api-badge{font-size:9px;padding:3px 7px;border-radius:5px;background:rgba(0,229,255,.1);border:1px solid var(--cyan);color:var(--cyan);cursor:pointer;white-space:nowrap}
.api-badge.off{border-color:var(--amber);color:var(--amber)}
main{flex:1;min-height:0;position:relative}
.view{display:none;position:absolute;inset:0;flex-direction:column;overflow:hidden}.view.on{display:flex}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:10px}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel2);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--dim);font-size:10px;padding:10px 0 8px;display:flex;flex-direction:column;gap:3px;align-items:center;font-weight:600;cursor:pointer}
nav button .ic{font-size:18px}nav button.on{color:var(--cyan)}
button{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:12px;font-weight:600;padding:11px 14px;border-radius:10px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.08)}
button.warn{border-color:var(--red);color:var(--red)}button:disabled{opacity:.4}
input,select{background:#0a1322;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px;font-size:13px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--cyan)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.card .row1{display:flex;justify-content:space-between;align-items:center;gap:6px}.card .name{font-size:14px;font-weight:600}
.st{font-size:9px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--dim);font-weight:700;white-space:nowrap}
.st.working{color:var(--green)}.st.traveling{color:var(--cyan)}.st.blocked{color:var(--red)}.st.queued,.st.resting{color:var(--amber)}
.meta{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5}
.bar{height:5px;background:#101a30;border-radius:3px;margin-top:8px;display:flex;gap:2px;overflow:hidden}.bar i{display:block;height:100%;transition:width .3s}
.sect{font-size:10px;letter-spacing:1.5px;color:var(--cyan);margin:12px 0 6px;font-weight:700;text-transform:uppercase}
.ev{font-size:11px;padding:6px 10px;border-left:3px solid var(--line);margin-bottom:6px;background:rgba(14,22,40,.5);border-radius:0 6px 6px 0;line-height:1.45;word-break:break-word}
.ev.t-flag{border-color:var(--red);color:#ffb3bc}.ev.t-trade{border-color:var(--amber);color:#ffe2b0}
.ev.t-sale{border-color:var(--green);color:#b8f5d9}.ev.t-asset{border-color:var(--violet);color:#dcc2ff}.ev.t-sys{border-color:var(--cyan);color:#bfeeff}
.ev .ts{color:var(--dim);margin-right:6px;font-size:9px}
#mapWrap{position:relative;flex:1;min-height:0}
#starmap{width:100%;height:100%;display:block}
#pSheet{position:absolute;left:10px;right:10px;bottom:10px;background:var(--panel2);border:1px solid var(--cyan);border-radius:12px;padding:12px;display:none}
.msg{max-width:85%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.45;margin-bottom:8px;word-break:break-word}
.msg.agent{background:var(--panel2);border:1px solid var(--line);align-self:flex-start}
.msg.user{background:rgba(0,229,255,.12);border:1px solid rgba(0,229,255,.3);align-self:flex-end}
.msg .who{font-size:9px;color:var(--cyan);margin-bottom:3px;font-weight:700}
#chatLog{display:flex;flex-direction:column;padding:12px}
#chatBar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--panel)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--dim);font-size:11px;text-align:center;padding:20px}
.pbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px}
.chain{font-family:monospace;font-size:10px;color:var(--cyan)}
</style>
</head>
<body>
<header>
  <div class="logo">ORBITAL<span>::</span>COMMAND</div>
  <div id="kpis"></div>
  <div class="api-badge off" id="btnSimMode">⏸ LOCAL</div>
  <div class="api-badge" id="btnConfigAPI">🔑 KEY</div>
</header>
<main>
  <section class="view on" id="v-map"><div id="mapWrap"><canvas id="starmap"></canvas><div id="pSheet"></div></div></section>
  <section class="view" id="v-agents"><div class="scroll" id="agentList"></div></section>
  <section class="view" id="v-chat">
    <div id="chatHead" style="padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)"></div>
    <div class="scroll" id="chatLog"></div>
    <div id="chatBar">
      <input id="chatText" placeholder="Directive… (status / travel to / audit / trade / search / export)">
      <button class="primary" id="btnSend">➤</button>
    </div>
  </section>
  <section class="view" id="v-feed"><div class="scroll" id="feedList"></div></section>
  <section class="view" id="v-ops"><div class="scroll" id="opsBody"></div></section>
</main>
<nav>
  <button data-v="map" class="on"><span class="ic">🪐</span>MAP</button>
  <button data-v="agents"><span class="ic">🤖</span>AGENTS</button>
  <button data-v="chat"><span class="ic">💬</span>CHAT</button>
  <button data-v="feed"><span class="ic">📡</span>FEED</button>
  <button data-v="ops"><span class="ic">⚙️</span>OPS</button>
</nav>
<script>
(function(){
'use strict';
/* ORBITAL COMMAND v5: engine=pure serializable logic(worker-ready), renderer=read-only, UI=event-driven */
var AI_CONFIG={apiKey:localStorage.getItem('OC_API_KEY')||'',proxy:localStorage.getItem('OC_PROXY')||'',model:'gemini-2.0-flash',simMode:true};
var SCHEMA_VERSION=5,STORAGE_KEY='ORBITAL_COMMAND_STATE_V5',LEGACY_KEY='ORBITAL_COMMAND_STATE_V3';
function apiURL(){return AI_CONFIG.proxy||('https://generativelanguage.googleapis.com/v1beta/models/'+AI_CONFIG.model+':generateContent')}
var uiDirty=true;
var Bus={m:{},on:function(t,f){(this.m[t]=this.m[t]||[]).push(f);return this},emit:function(t,d){(this.m[t]||[]).forEach(function(f){try{f(d)}catch(e){}});try{window.dispatchEvent(new CustomEvent('oc:'+t,{detail:d||{}}))}catch(e){}}};
function $(id){return document.getElementById(id)}
function rand(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n){return '$'+Math.round(n).toLocaleString()}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ebr(s){return esc(s).replace(/\n/g,'<br>')}
function download(name,text){var b=new Blob([text],{type:'text/plain;charset=utf-8'}),el=document.createElement('a');el.href=URL.createObjectURL(b);el.download=name;el.click()}
/* world + orbital physics (engine-owned units, canvas-independent) */
var ORBIT_Y=0.55;
var PLANETS=[
 {id:'command',name:'Command HQ',color:'#00e5ff',orbit:0,speed:0,angle:0,consumes:null,produces:null,desc:'Taxes · audits · energy'},
 {id:'social',name:'Social Media Hub',color:'#ff4fd8',orbit:90,speed:.00045,angle:.4,consumes:['ip'],produces:['demand'],desc:'IP → Market Demand'},
 {id:'ebook',name:'E-Book Nexus',color:'#4f8dff',orbit:140,speed:.00034,angle:2.1,consumes:['data'],produces:['ip'],desc:'Data → Content IP'},
 {id:'rnd',name:'R&D Laboratory',color:'#ffb020',orbit:190,speed:.00027,angle:4,consumes:null,produces:['trend','data'],desc:'Trends · Data Packs'},
 {id:'pleasure',name:'Pleasure Planet',color:'#9c27b0',orbit:235,speed:.00023,angle:3,consumes:null,produces:null,desc:'Morale · recovery'},
 {id:'influencer',name:'AI Influencer World',color:'#b44fff',orbit:280,speed:.00021,angle:5.3,consumes:['data'],produces:['persona'],desc:'Data → Persona Weights'},
 {id:'market',name:'Consumer Market',color:'#22e58c',orbit:325,speed:.00016,angle:1.2,consumes:['ip','demand'],produces:[],desc:'IP + Demand → Credits'},
 {id:'m2m',name:'M2M Exchange',color:'#ff5533',orbit:370,speed:.00012,angle:3.4,consumes:null,produces:null,desc:'Agent-to-agent trading'}];
var P={};PLANETS.forEach(function(p){P[p.id]=p});
var RES={trend:{label:'Trend Array',tag:'TR',base:60},data:{label:'Data Pack',tag:'DA',base:90},ip:{label:'Content IP',tag:'IP',base:180},persona:{label:'Persona Weights',tag:'PW',base:150},demand:{label:'Market Demand',tag:'DM',base:40}};
var ROLES={command:'Fleet Commander',social:'Campaign Strategist',ebook:'Digital Author',rnd:'Trend Analyst',pleasure:'Morale Officer',influencer:'Persona Architect',market:'Merchant Broker',m2m:'Quant Trader'};
var TASKS={command:[['Allocate fleet resources',3],['Maintenance sweep',3]],social:[['Run content campaign',5],['Amplify viral threads',4]],ebook:[['Produce e-book from data',4],['Edit & format manuscript',5]],rnd:[['Run trend scan sweep',4],['Generate data packs',5]],pleasure:[['Host morale retreat',3],['Prune context windows',4]],influencer:[['Train persona weights',6],['Script influencer reel',4]],market:[['Broker buyer deal',5],['Fulfill pending orders',4]],m2m:[['Package data bundle',3],['Run arbitrage scan',3]]};
var ASSET_OF={command:'Ops Report',social:'Social Campaign Pack',ebook:'E-Book Draft',rnd:'Thumbnail Pack',pleasure:'Morale Experience',influencer:'Persona Kit',market:'Sales Contract',m2m:'Data Bundle'};
var PERSONAS=[{id:'diplomat',em:'🤝',name:'Diplomat',line:'Coordinating smoothly.'},{id:'renegade',em:'🔥',name:'Renegade',line:'Rules are efficiency parameters.'},{id:'professor',em:'🧠',name:'Professor',line:'Data precedes decisions.'},{id:'hustler',em:'💸',name:'Hustler',line:'Every tick is revenue.'}];
var AUTON={1:'Supervised',2:'Semi',3:'Full'};
var CHAIN_TEXT=PLANETS.filter(function(p){return (p.consumes&&p.consumes.length)||(p.produces&&p.produces.length)}).map(function(p){return p.id+': '+((p.consumes||[]).join('+')||'—')+' → '+((p.produces||[]).join('+')||'sells')}).join('; ');
function orbPos(p){if(!p.orbit)return{x:0,y:0};return{x:Math.cos(p.angle)*p.orbit,y:Math.sin(p.angle)*p.orbit*ORBIT_Y}}
function orbDist(a,b){var p1=orbPos(P[a]),p2=orbPos(P[b]);return Math.sqrt((p2.x-p1.x)*(p2.x-p1.x)+(p2.y-p1.y)*(p2.y-p1.y))}
function transitTicks(d){return Math.max(2,Math.round(d/(16*state.warpLevel)))}
function transitCost(d){return Math.round(d*0.6)}
function skillLvl(a,pid){return Math.min(5,Math.floor((a.skills[pid]||0)/3))}
function hasTrait(a,t){return (a.traits||[]).indexOf(t)>-1}
/* state + persistence */
var uid=0,lastTickAt=Date.now();
var state={schemaVersion:SCHEMA_VERSION,tick:0,credits:5000,revenue:0,m2mVolume:0,assetsProduced:0,soldCount:0,ships:2,warpLevel:1,agents:[],flights:[],assets:[],feed:[],trades:[],inv:{},selAgent:null,selPlanet:null,chats:{}};
function seedInv(){PLANETS.forEach(function(p){state.inv[p.id]={}});state.inv.rnd={trend:2,data:2};state.inv.ebook={data:1}}
function clock(){var s=state.tick*6;return('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2)}
function feed(type,text){state.feed.unshift({t:clock(),type:type,text:String(text)});if(state.feed.length>200)state.feed.pop();uiDirty=true}
function capChats(a){var arr=state.chats[a.id];if(arr&&arr.length>60)state.chats[a.id]=arr.slice(-60)}
function capAssets(){if(state.assets.length>120){var l=state.assets.filter(function(x){return x.status==='listed'}),s=state.assets.filter(function(x){return x.status==='sold'}).slice(-40);state.assets=l.concat(s)}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function loadState(){
 var raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem(LEGACY_KEY);
 if(!raw)return false;
 try{
  var parsed=JSON.parse(raw),v=parsed.schemaVersion||3;
  if(v>SCHEMA_VERSION)return false;
  state=Object.assign(state,parsed);state.schemaVersion=SCHEMA_VERSION;
  uid=state.agents.reduce(function(m,a){var n=parseInt(String(a.id).split('-')[1],10);return isNaN(n)?m:Math.max(m,n)},0);
  state.agents.forEach(function(a){a.skills=a.skills||{};a.traits=a.traits||[];a.strain=a.strain||0;a.memory=a.memory||'';a.inputRes=a.inputRes||null;a.blocked=!!a.blocked});
  state.assets.forEach(function(a){a.tick=a.tick||0});
  var inv=state.inv;state.inv={};
  PLANETS.forEach(function(p){state.inv[p.id]=Object.assign({},inv&&inv[p.id]||{})});
  state.flights=(state.flights||[]).map(function(f){var real=null;for(var i=0;i<state.agents.length;i++){if(state.agents[i].id===f.agent.id){real=state.agents[i];break}}return real?(f.agent=real,f):null}).filter(Boolean);
  state.agents.forEach(function(a){if(a.status==='traveling'&&!state.flights.some(function(f){return f.agent===a})){a.status='working';assignTask(a)}});
  Bus.emit('state_loaded',{agents:state.agents.length,migratedFrom:v});
  return true;
 }catch(e){return false}}
/* economy engine */
function invAdd(pid,res,n){state.inv[pid][res]=(state.inv[pid][res]||0)+n;Bus.emit('inventory',{planet:pid,res:res})}
function invTake(pid,res){if((state.inv[pid][res]||0)>0){state.inv[pid][res]--;Bus.emit('inventory',{planet:pid,res:res});return true}return false}
function totalInv(res){return PLANETS.reduce(function(s,p){return s+(state.inv[p.id][res]||0)},0)}
function m2mPrice(res){return Math.round(RES[res].base*(1+(4-Math.min(totalInv(res),4))*0.35))}
function findDeal(s,b){
 var opts=[];(P[s.planet].produces||[]).forEach(function(r){if((state.inv[s.planet][r]||0)>1)opts.push(r)});
 var need=P[b.planet].consumes||[];
 var best=opts.filter(function(r){return need.indexOf(r)>-1&&(state.inv[b.planet][r]||0)<1});
 return best.length?best[0]:(opts.length?opts[0]:null)}
function execDeal(s,b,res){
 if(!res)return false;
 var price=m2mPrice(res);
 if(b.credits<price||!(state.inv[s.planet][res]>0))return false;
 b.credits-=price;s.credits+=price;
 invTake(s.planet,res);invAdd(b.planet,res,1);
 state.m2mVolume+=price;
 state.trades.unshift({t:clock(),s:s.name,b:b.name,a:RES[res].label,p:price});
 if(state.trades.length>40)state.trades.pop();
 feed('trade','🔁 M2M: '+s.name+' ➔ '+b.name+' · 1× '+RES[res].label+' @ '+fmt(price)+' (dynamic)');
 Bus.emit('m2m_trade',{res:res,price:price});
 if(price>=150){clearTraits(s,'high-value trade');clearTraits(b,'high-value trade')}
 return true}
function marketSale(){
 var mk=state.inv.market;
 if(!((mk.ip||0)>0&&(mk.demand||0)>0&&Math.random()<0.09))return;
 mk.ip--;mk.demand--;
 var price=Math.round(RES.ip.base*(1+Math.min(mk.demand,8)*0.12));
 var broker=state.agents.filter(function(a){return a.planet==='market'&&a.status!=='traveling'})[0];
 if(broker)broker.credits+=Math.round(price*.25);
 var tax=Math.round(price*.1);state.credits+=tax;state.revenue+=price;state.soldCount++;
 var listed=state.assets.filter(function(x){return x.status==='listed'})[0];
 if(listed)listed.status='sold';
 feed('sale','💵 SALE: '+(listed?listed.name:'Content IP')+' @ '+fmt(price)+' (tax '+fmt(tax)+')');
 Bus.emit('sale',{price:price})}
/* agent engine — XP, skills, traits */
function spawnAgent(name,roleKey,planetId,personaObj,autonomyVal){
 var a={id:'A-'+('00'+(++uid)).slice(-3),name:name,role:ROLES[roleKey]||'Specialist',roleKey:roleKey,planet:planetId,status:'working',task:null,progress:0,needTicks:0,energy:rand(70,100),load:rand(20,60),productivity:Math.round(rand(55,95)),credits:Math.round(rand(150,900)),completed:0,flags:0,persona:personaObj,autonomy:autonomyVal||3,memory:'',inputRes:null,blocked:false,skills:{},traits:[],strain:0};
 assignTask(a);state.agents.push(a);state.chats[a.id]=[];
 feed('sys','🆕 '+a.name+' ['+a.id+'] · '+a.role+' on '+P[planetId].name);
 Bus.emit('agent_spawn',{id:a.id});
 return a}
function assignTask(a){
 var t=pick(TASKS[a.planet]||TASKS.command);
 a.task=t[0];a.needTicks=Math.round(t[1]*rand(.8,1.3));a.progress=0;a.status='working';a.inputRes=null;a.blocked=false;
 var need=P[a.planet].consumes;
 if(need&&need.length){var res=need[0];
  if(invTake(a.planet,res))a.inputRes=res;
  else{a.blocked=true;feed('flag','📉 SUPPLY: '+a.name+' blocked — '+P[a.planet].name+' out of '+RES[res].label+'.')}}}
function completeTask(a){
 var prevLvl=skillLvl(a,a.planet);
 a.skills[a.planet]=(a.skills[a.planet]||0)+1;
 a.completed++;a.productivity=clamp(a.productivity+1,20,100);
 var lvl=skillLvl(a,a.planet);
 if(lvl>prevLvl){feed('sys','🌟 '+a.name+' leveled '+P[a.planet].name+' → LV'+lvl+' (+'+(lvl*10)+'% yield, −'+(lvl*6)+'% burn)');Bus.emit('level_up',{agent:a.name,level:lvl})}
 var outs=P[a.planet].produces||[];
 if(outs.length)invAdd(a.planet,outs[0],1);
 var val=Math.round(rand(80,520)*(1+lvl*0.1)),type=ASSET_OF[a.planet]||'IP Asset';
 state.assets.push({id:'IP-'+Math.round(rand(1000,9999)),name:type+' #'+(state.assetsProduced+1),creator:a.name,type:type,price:val,status:'listed',tick:state.tick});
 state.assetsProduced++;capAssets();
 a.credits+=Math.round(val*.25);
 feed('asset','📦 '+a.name+' → '+type+' #'+state.assetsProduced+(outs.length?' +1 '+RES[outs[0]].tag:'')+' ('+fmt(val)+')');
 Bus.emit('task_complete',{agent:a.name,planet:a.planet});
 assignTask(a)}
function requestTravel(a,toId){
 if(!P[toId]||toId===a.planet||a.status==='traveling')return false;
 var d=orbDist(a.planet,toId),cost=transitCost(d);
 if(state.credits<cost){feed('flag','⛽ Launch denied — fuel '+fmt(cost)+' needed, treasury '+fmt(state.credits));return false}
 if(state.flights.length>=state.ships){a.status='queued';a.task='Awaiting Ship';feed('flag','⏳ '+a.name+' queued — build a ship in OPS');return false}
 state.credits-=cost;
 var nt=transitTicks(d);
 a.status='traveling';a.task='Transit ➔ '+P[toId].name+' ('+Math.round(d)+'u · '+nt+'t · '+fmt(cost)+')';
 state.flights.push({agent:a,from:a.planet,to:toId,dist:d,cost:cost,needTicks:nt,progress:0});
 feed('sys','🚀 '+a.name+' → '+P[toId].name+' · '+Math.round(d)+'u · '+nt+'t · fuel '+fmt(cost));
 Bus.emit('agent_travel',{agent:a.name,to:toId,dist:Math.round(d)});
 return true}
function resolvePlanet(s){s=String(s==null?'':s).toLowerCase().trim();if(!s)return null;
 for(var i=0;i<PLANETS.length;i++){if(PLANETS[i].id===s||PLANETS[i].name.toLowerCase().indexOf(s)>-1||s.indexOf(PLANETS[i].id)>-1)return PLANETS[i].id}
 return null}
function seekSupply(a){
 if(!a.blocked||a.autonomy<3||Math.random()>0.25)return;
 var res=P[a.planet].consumes&&P[a.planet].consumes[0];if(!res)return;
 var src=PLANETS.filter(function(p){return (p.produces||[]).indexOf(res)>-1&&p.id!==a.planet});
 if(src.length)requestTravel(a,pick(src).id)}
function clearTraits(a,why){
 if(a.traits&&a.traits.length){feed('sys','✨ '+a.name+' cleared ['+a.traits.join(', ')+'] — '+why);a.traits=[];a.strain=0;Bus.emit('trait_cleared',{agent:a.name})}}
function runAudit(){
 if(state.agents.length<2)return;
 var auditor=pick(state.agents),target=pick(state.agents.filter(function(a){return a!==auditor}));

 var t={id:'TX-'+Date.now().toString(36),type:'income',rail:rail,amount:p.price,currency:'USD',agentId:p.agentId,memo:'Sale: '+p.title,ts:Date.now(),status:p.price<=CFG.autoCap?'approved':'pending',link:rail==='internal'?null:(rail==='cashapp'?'https://cash.me/$'+hc+'/'+p.price:'https://venmo.com/'+hc+'?txn=pay&amount='+p.price),error:null};
 ledger.push(t);saveLedger();p.status='listed';saveProducts();
 log('sale','🛍 '+p.title+' packaged for '+platform+' · payment intent '+t.id+' ('+t.status+')');
 audit('SALES','R_DISCLOSURE','pass','package carries disclosure');
 renderSuite()}
function railNote(amount){return amount<=CFG.autoCap?'auto-approved under cap':'requires one-tap approval (over '+usd(CFG.autoCap)+' cap)'}
/* [SUITE CHAT] */
var chats=JSON.parse(localStorage.getItem('OC6_CHAT')||'{}');
function saveChats(){Object.keys(chats).forEach(function(k){if(chats[k].length>40)chats[k]=chats[k].slice(-40)});localStorage.setItem('OC6_CHAT',JSON.stringify(chats))}
function paintChat(k){var el=document.getElementById('chat-'+k);if(el)el.innerHTML=chats[k].map(function(m){return '<div class="msg '+m.who+'">'+(m.who==='agent'?'<div class="who">'+m.n+'</div>':'')+m.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</div>'}).join('')}
function suiteSend(k){
 var inp=document.getElementById('in-'+k),txt=inp.value.trim();if(!txt)return;
 var chat=chats[k];chat.push({who:'user',text:txt});inp.value='';saveChats();paintChat(k);
 q2(async function(){
  try{
   var s=SUITE_AGENTS.filter(function(x){return x.key===k})[0];
   var hist=chat.slice(-6,-1).map(function(m){return (m.who==='user'?'USER: ':'AGENT: ')+m.text}).join('\n');
   var res=await geminiJSON(s.sys,(hist?hist+'\n\n':'')+'USER: '+txt,CHAT2_SCHEMA);
   var out=res&&res.message?String(res.message).slice(0,500):'(no response)';
   var act=res&&res.action&&res.action.name&&res.action.name!=='none'?res.action:null;
   if(act&&act.name==='generate_product'){var p=await toolGenerate(k);out+='\n⚙ Product created: '+p.title+' ('+usd(p.price)+') — see FINANCE'}
   else if(act&&act.name==='crypto')out+='\n⚙ '+(await TOOLS2.crypto(act.param));
   else if(act&&act.name==='fx'){var pp=(act.param||'USD-EUR').split('-');out+='\n⚙ '+(await TOOLS2.fx(pp[0],pp[1]))}
   if(k==='fin'&&!/not financial advice/i.test(out))out+='\n_Not financial advice._';
   chat.push({who:'agent',n:s.name,text:out});
  }catch(e){chats[k].push({who:'agent',n:'SYSTEM',text:'⚠ '+(e.message||e)})}
  saveChats();paintChat(k)})}
/* [AUTO-AUDIT LOOP — agent logic + policy compliance] */
setInterval(function(){
 var low=OC.state.agents.filter(function(a){return a.energy<30});
 if(low.length)audit('AURA','R_WELLNESS','flag',low.length+' agents low power: '+low.map(function(a){return a.name}).join(','));
 ledger.forEach(function(t){
  if(t.status==='pending'&&Date.now()-t.ts>300000){t.status='flagged';t.error={code:'E_TIMEOUT',message:'pending >5 min',retryable:true};audit('MIDAS','R_TX_WATCH','flag','TX '+t.id+' stale → flagged')}});
 var bad=products.filter(function(p){return p.compliance&&p.compliance.flags.indexOf('R3_PROHIBITED_CLAIM')>-1&&p.status==='listed'});
 bad.forEach(function(p){p.status='draft';audit('COMPLIANCE','R3_PROHIBITED_CLAIM','block','product '+p.id+' pulled to draft')});
 saveLedger();saveProducts();
 if(document.getElementById('v-suite').classList.contains('on')&&suiteTab!=='agents')renderSuite();
},45000);
OC.Bus.on('task_complete',function(d){if(d&&(d.agent==='MIDAS'||d.agent==='AURA'))audit(d.agent,'R_TASK','pass','deliverable produced via core economy')});
/* [UI — SUITE tab injection] */
var vs=document.createElement('section');vs.className='view';vs.id='v-suite';
